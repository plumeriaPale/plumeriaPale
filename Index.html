<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары и цены</title>
</head>
<body>


<button onclick="fun()">Fetch</button>

<div id="headersDiv">
</div>
<script>
const headersDiv = document.querySelector("#headersDiv");
async function fun() {
  try {
    const response = await fetch('https://en.wikipedia.org/api/rest_v1/page/html/JavaScript');
    const data = await response.text();
    
    const parser = new DOMParser();
    const doc = parser.parseFromString(data, 'text/html');
    
    console.log(doc.querySelectorAll('h2, h3'));

    const headers = doc.querySelectorAll('h2, h3');

    let str = "<ul>";
 
    for(i = 0; i < headers.length; i++){
    str += "<li>" + headers[i].textContent + "</li>";
    }
    str += "</ul>";
    headersDiv.innerHTML += str;
    
    //console.log(response);
    
    //console.log(data);
  } catch(error) {
    console.log(error);
  }
}

</script>
</body>
</html>
